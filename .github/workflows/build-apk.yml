name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build YouDO Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clear Gradle Caches
        run: |
          rm -rf ~/.gradle
          rm -rf android/build
          rm -rf android/.gradle
          rm -rf android/app/build

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Assets to Android
        run: npx @capacitor/cli sync android

      - name: Force AGP & Capacitor Script Alignment
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          touch android/capacitor-cordova-android-plugins/cordova.variables.gradle
          sed -i "s/classpath 'com.android.tools.build:gradle:.*/classpath 'com.android.tools.build:gradle:8.7.0'/g" android/build.gradle
          if [ -f android/capacitor-cordova-android-plugins/build.gradle ]; then
            sed -i "s/classpath 'com.android.tools.build:gradle:.*/classpath 'com.android.tools.build:gradle:8.7.0'/g" android/capacitor-cordova-android-plugins/build.gradle
          fi
          sed -i "s/sourceCompatibility JavaVersion.VERSION_.*/sourceCompatibility JavaVersion.VERSION_21/g" android/app/build.gradle
          sed -i "s/targetCompatibility JavaVersion.VERSION_.*/targetCompatibility JavaVersion.VERSION_21/g" android/app/build.gradle

      - name: Pre-warm Gradle Wrapper
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Xmx6144m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.unsafe.build-cache=false"
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouDO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
