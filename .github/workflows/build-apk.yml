name: Build Android APK

on:
  push:
    branches:
      - main
      - 'codex/release-*'
  workflow_dispatch:

jobs:
  build:
    name: Build YouDO Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Same debug keystore across runs — without this, every CI APK is signed with a
      # fresh key and Android refuses install-over even when versionCode increases.
      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: youdo-android-debug-keystore-v1

      - name: Ensure Android debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Clear Gradle Caches
        run: |
          rm -rf ~/.gradle
          rm -rf android/build
          rm -rf android/.gradle
          rm -rf android/app/build

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Assets to Android
        run: npx @capacitor/cli sync android

      - name: Align AGP versions and Java compatibility
        run: |
          sed -i "s/classpath 'com.android.tools.build:gradle:.*/classpath 'com.android.tools.build:gradle:8.13.0'/g" android/build.gradle
          sed -i "s/classpath 'com.android.tools.build:gradle:.*/classpath 'com.android.tools.build:gradle:8.13.0'/g" android/capacitor-cordova-android-plugins/build.gradle
          sed -i "s/sourceCompatibility JavaVersion.VERSION_.*/sourceCompatibility JavaVersion.VERSION_21/g" android/app/build.gradle
          sed -i "s/targetCompatibility JavaVersion.VERSION_.*/targetCompatibility JavaVersion.VERSION_21/g" android/app/build.gradle

      - name: Pre-warm Gradle Wrapper
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Xmx6144m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.unsafe.build-cache=false"
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace -x lint

      - name: Verify APK signature and checksum
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify install-over compatibility with v5.0.0
        run: |
          CURRENT_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          PREVIOUS_APK="$RUNNER_TEMP/youdo-v5.0.0.apk"
          curl --fail --location --silent --show-error \
            --output "$PREVIOUS_APK" \
            "https://github.com/mattedhairr/YouDO/releases/download/v5.0.0/YouDO.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          CURRENT_CERT="$("$APKSIGNER" verify --print-certs "$CURRENT_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          PREVIOUS_CERT="$("$APKSIGNER" verify --print-certs "$PREVIOUS_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$CURRENT_CERT" && test "$CURRENT_CERT" = "$PREVIOUS_CERT"

          CURRENT_CODE="$("$AAPT" dump badging "$CURRENT_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          PREVIOUS_CODE="$("$AAPT" dump badging "$PREVIOUS_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          test -n "$CURRENT_CODE" && test -n "$PREVIOUS_CODE" && test "$CURRENT_CODE" -gt "$PREVIOUS_CODE"
          echo "Install-over verified: matching certificate; versionCode $PREVIOUS_CODE -> $CURRENT_CODE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouDO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
