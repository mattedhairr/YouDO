<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your YouDO password</title></head>
<body style="margin:0;padding:24px;background:#171612;color:#f5f2ec;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" style="width:100%;max-width:560px;margin:0 auto;border-collapse:collapse;"><tr><td style="padding:28px;background:#24211d;border:1px solid #4a4135;border-radius:16px;">
    <p style="margin:0 0 24px;color:#d8b47a;font-size:22px;font-weight:700;"><img src="https://tu-do-psi.vercel.app/icon-192.png" width="40" height="40" alt="" style="vertical-align:middle;border:0;border-radius:8px;"> <span style="vertical-align:middle;">YouDO</span></p>
    <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Reset your password</h1>
    <p style="margin:0 0 24px;color:#d5cfc5;font-size:16px;line-height:1.6;">We received a request to reset your YouDO password. Open the link below to choose a new one.</p>
    <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;background:#d8b47a;border-radius:10px;color:#171612;font-size:16px;font-weight:700;text-decoration:none;">Choose a new password</a></p>
    <p style="margin:0;color:#ada69b;font-size:13px;line-height:1.6;">If you didn't request this, ignore this email. Your current password will remain unchanged. If you requested more than one reset, use the newest email.</p>
  </td></tr></table>
</body>
</html>
